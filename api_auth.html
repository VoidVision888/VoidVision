<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidVision - Secure Connection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', 'Share Tech Mono', sans-serif !important; letter-spacing: 0.8px; }
        body {
            background-color: #030508; color: #00ffcc; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #0b192c 0%, #030508 100%);
            overflow: hidden; position: relative;
        }
        /* 动态背景网格 */
        .grid-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; z-index: 0; opacity: 0.5;
        }
        .auth-container {
            width: 420px; background: rgba(10, 20, 30, 0.75);
            border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 12px;
            padding: 40px 35px; backdrop-filter: blur(15px);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.05), inset 0 0 20px rgba(0,0,0,0.8);
            z-index: 10; position: relative;
        }
        .logo-box { text-align: center; margin-bottom: 30px; }
        .logo { font-family: 'Orbitron', sans-serif !important; font-weight: 900; font-size: 24px; color: #fff; text-shadow: 0 0 15px #00ffcc; letter-spacing: 2px; }
        .sub-logo { font-family: 'Share Tech Mono', monospace !important; font-size: 11px; color: #8892b0; margin-top: 5px; text-transform: uppercase; }
        
        .input-group { margin-bottom: 20px; }
        .input-label { font-family: 'Share Tech Mono', monospace !important; font-size: 11px; color: #8892b0; margin-bottom: 8px; display: block; text-transform: uppercase; }
        .cyber-input {
            width: 100%; background: rgba(3, 5, 8, 0.8); border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 12px 15px; color: #00ffcc; font-size: 14px; border-radius: 4px;
            outline: none; transition: all 0.3s; font-family: 'Share Tech Mono', monospace !important;
        }
        .cyber-input:focus { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.2); }
        .cyber-input::placeholder { color: rgba(136, 146, 176, 0.3); }

        .auth-btn {
            width: 100%; background: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc;
            color: #00ffcc; padding: 14px; font-size: 14px; font-weight: bold;
            font-family: 'Orbitron', sans-serif !important; letter-spacing: 1.5px;
            cursor: pointer; transition: all 0.3s; border-radius: 4px; margin-top: 10px;
        }
        .auth-btn:hover { background: #00ffcc; color: #030508; box-shadow: 0 0 15px #00ffcc; }
        
        .security-badge {
            margin-top: 25px; text-align: center; font-size: 10px; color: #00ff66;
            font-family: 'Share Tech Mono', monospace !important; display: flex;
            align-items: center; justify-content: center; gap: 6px;
        }
        .lock-icon { width: 12px; height: 12px; border: 1px solid #00ff66; border-radius: 2px; position: relative; }
        .lock-icon::before { content: ''; position: absolute; top: -5px; left: 2px; width: 6px; height: 5px; border: 1px solid #00ff66; border-bottom: none; border-radius: 3px 3px 0 0; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="auth-container">
        <div class="logo-box">
            <div class="logo">VOIDVISION</div>
            <div class="sub-logo">Polymarket Quant Terminal // V.V.</div>
        </div>
        
        <div class="input-group">
            <label class="input-label">Proxy Address (代理钱包地址)</label>
            <input type="text" class="cyber-input" placeholder="0x..." autocomplete="off">
        </div>
        
        <div class="input-group">
            <label class="input-label">Private Key / API Secret</label>
            <input type="password" class="cyber-input" placeholder="••••••••••••••••••••••••" autocomplete="off">
        </div>
        
        <button class="auth-btn" id="loginBtn" onclick="simulateLogin()">INITIALIZE CONNECTION</button>
        
        <div class="security-badge" id="secText">
            <div class="lock-icon"></div>
            终端级 AES-256 混淆加密 | 平台零资金托管
        </div>
    </div>

    <script>
        function simulateLogin() {
            const btn = document.getElementById('loginBtn');
            const sec = document.getElementById('secText');
            btn.innerText = "ENCRYPTING KEY...";
            btn.style.borderColor = "#00ff66";
            btn.style.color = "#00ff66";
            
            let dots = 0;
            const interval = setInterval(() => {
                dots = (dots + 1) % 4;
                sec.innerHTML = `<div style="color:#00ffcc">正在执行 AES-256 本地混淆${'.'.repeat(dots)}</div>`;
            }, 300);

            setTimeout(() => {
                clearInterval(interval);
                btn.innerText = "CONNECTION ESTABLISHED";
                btn.style.background = "#00ffcc";
                btn.style.color = "#030508";
                sec.innerHTML = `<div class="lock-icon" style="border-color:#00ffcc"></div><span style="color:#00ffcc">鉴权成功，正在跳转终端...</span>`;
                // 这里预留跳转逻辑： window.location.href = 'index.html';
            }, 2500);
        }
    </script>
</body>
</html>
